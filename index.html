<title>Forestrix · University Parks</title>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<style>
  :root{color-scheme:light;--pine:#17382b;--green:#235e43;--ink:#162b21;--muted:#496354;--paper:#f6f8f1;--line:#dce5d8;--white:#fff;--free:#59615e;--mine:#227847;--rival:#ad332e;--dry:#855331;--gold:#ffdf91}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif}
  button{font:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:3px solid #0e73a0;outline-offset:2px}
  button:disabled{cursor:default;opacity:.68}
  button.primary,button.secondary{min-height:44px;border-radius:10px;padding:8px 13px;font-weight:700}
  button.primary{background:var(--green);color:#fff;border:1px solid var(--green)}
  button.secondary{color:var(--pine);background:#fff;border:1px solid #b9cbbd}
  h1,h2,h3,p{margin:0}
  h1{font-size:23px;line-height:1.15;letter-spacing:-.045em}
  h2{font-size:23px;letter-spacing:-.035em}
  h3{font-size:16px}
  small,.muted{color:var(--muted)}
  [hidden]{display:none!important}
  #app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
  header{background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(9px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
  header small{color:#d6e8db}
  #wallet{white-space:nowrap;color:var(--gold);font-size:16px;font-weight:750;padding:6px 10px;border-radius:10px;background:#244837}
  main,.screen{min-height:0}
  .screen{height:100%;overflow:auto}
  .content{max-width:790px;margin:auto;padding:16px}
  .map-screen{display:grid;grid-template-rows:auto minmax(100px,1fr) auto}
  .map-toolbar{padding:6px 10px;background:var(--white);display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2}
  #position-mode{flex-shrink:0}
  #position-mode,#locate,.close{background:#fff;color:var(--pine);border:1px solid #c5d3c8;border-radius:8px;min-height:44px;padding:5px 9px;font-weight:700}
  #radar{font-size:13px;font-weight:650}
  #radar[data-heat="caliente"]{color:#aa3426}
  #radar[data-heat="templado"]{color:#8a5209}
  #radar[data-heat="frío"]{color:#265c81}
  .map-wrap{position:relative;min-height:0;background:#e8efdf;isolation:isolate}
  #map{height:100%;width:100%;background:linear-gradient(145deg,#e5efdb,#d4e4cb);font:inherit;z-index:0}
  #map .leaflet-interactive:focus{outline:2px solid #0e73a0;outline-offset:3px}
  #locate{position:absolute;z-index:1;bottom:25px;right:10px;font-size:13px;box-shadow:0 1px 4px #17382b26}
  #map-bottom{background:var(--white);padding:7px 12px;border-top:1px solid var(--line);max-height:40dvh;overflow:auto}
  #map-status{font-size:12px;margin:3px 0}
  .legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;background:var(--dot);width:8px;height:8px;border-radius:50%;margin-right:4px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .tree-heading{flex-wrap:nowrap;align-items:flex-start}
  .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .hint{margin-top:5px;font-size:13px;color:var(--muted)}
  .cards,.stats,.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 16px}
  .teams{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile,.entry{border:1px solid var(--line);border-radius:12px;background:var(--white);padding:10px;overflow-wrap:anywhere}
  .entry{margin:8px 0}
  .tile strong,.tile small{display:block}
  .rare{background:#fff4d3;border-color:#c99537}
  .entries{margin:8px 0 16px}
  .ref-line{font-size:12px;color:var(--muted);margin:10px 0}
  progress{display:block;width:100%;margin:6px 0;accent-color:var(--green)}
  nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--white);border-top:1px solid var(--line);padding:2px max(4px,env(safe-area-inset-right)) calc(3px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}
  nav button{min-height:49px;background:transparent;color:var(--muted);border:0;border-top:3px solid transparent;padding:3px 2px;font-size:12px;font-weight:700}
  nav button[aria-selected="true"]{border-top-color:var(--green);color:var(--pine);background:#eaf2e8}
  #notice{position:fixed;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;width:max-content;max-width:calc(100% - 24px);background:var(--pine);color:white;border-radius:9px;padding:8px 13px;box-shadow:0 2px 8px #13281b35;pointer-events:none}
  #duel-banner{display:block;width:100%;min-height:31px;border:0;background:#ffe5c9;color:#642b16;font-weight:700}
  #storage-error{background:#fff0d6;color:#5e3100;text-align:center;font-size:12px;padding:3px 8px}
  @media(min-width:650px){.cards,.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.map-toolbar,#map-bottom{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<div id="app">
  <div>
    <header>
      <div><h1>Forestrix</h1><small>University Parks, Oxford</small></div>
      <div id="wallet" aria-label="Tu saldo de Savia">0 Savia</div>
    </header>
    <button id="duel-banner" type="button" hidden></button>
    <div id="storage-error" role="alert" hidden>El navegador no puede guardar la partida. Exporta tus datos antes de cerrar.</div>
  </div>
  <main>
    <section id="panel-mapa" class="screen map-screen" role="tabpanel" aria-labelledby="tab-mapa">
      <div class="map-toolbar">
        <div><div id="radar">Radar · esperando ubicación</div><small id="gps-status" aria-live="polite">Buscando GPS…</small></div>
        <button id="position-mode" type="button">Modo prueba</button>
      </div>
      <div class="map-wrap">
        <div id="map" aria-label="Mapa de University Parks"></div>
        <button id="locate" type="button">Centrar mapa</button>
      </div>
      <div id="map-bottom">
        <div id="tree-detail" hidden></div>
        <div id="map-overview">
          <div class="legend" aria-label="Estados de los árboles">
            <span style="--dot:var(--free)">Libre</span><span style="--dot:var(--mine)">Mío</span><span style="--dot:var(--rival)">Rival</span><span style="--dot:var(--dry)">Seco</span>
          </div>
          <p id="map-status" class="muted" role="status">Buscando árboles en OpenStreetMap…</p>
          <button id="reload-trees" class="secondary" type="button" hidden>Reintentar carga</button>
        </div>
      </div>
    </section>
    <section id="panel-herbario" class="screen" role="tabpanel" aria-labelledby="tab-herbario" hidden><div class="content" id="herbarium"></div></section>
    <section id="panel-arboles" class="screen" role="tabpanel" aria-labelledby="tab-arboles" hidden><div class="content" id="my-trees"></div></section>
    <section id="panel-perfil" class="screen" role="tabpanel" aria-labelledby="tab-perfil" hidden><div class="content" id="profile"></div></section>
  </main>
  <nav role="tablist" aria-label="Pantallas">
    <button id="tab-mapa" role="tab" aria-controls="panel-mapa" aria-selected="true" type="button">Mapa</button>
    <button id="tab-herbario" role="tab" aria-controls="panel-herbario" aria-selected="false" type="button">Herbario</button>
    <button id="tab-arboles" role="tab" aria-controls="panel-arboles" aria-selected="false" type="button">Mis árboles</button>
    <button id="tab-perfil" role="tab" aria-controls="panel-perfil" aria-selected="false" type="button">Perfil</button>
  </nav>
</div>
<div id="notice" role="status" hidden></div>
<input id="camera" type="file" accept="image/*" capture="environment" hidden>

    event(inside ? 'entrar_parque' : 'salir_parque',null,now);
  }
  checkAwake(now);
  save();
  drawPlayer();
  if (!previous && mode === 'gps' && map && inPark(fix)) map.panTo([lat,lng]);
  render(now);
}
function setMode(next,reason = '') {
  tick();
  if (inside && locationFix) event('salir_parque',null,Date.now(),coords(),{motivo:'cambio_modo'});
  gpsGeneration++;
  if (gpsWatch !== undefined) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch = undefined;
  mode = state.mode = next;
  locationFix = walkAnchor = null;
  inside = false;
  save();
  drawPlayer();
  gpsText = reason;
  if (next === 'test') {
    gpsText ||= 'Modo prueba · toca el mapa para moverte';
    if (map) fitPark();
  } else if (!navigator.geolocation || !window.isSecureContext) {
    setMode('test','GPS no disponible · toca el mapa para moverte');
    return;
  } else {
    gpsText = 'Buscando GPS…';
    const generation = gpsGeneration;
    gpsWatch = navigator.geolocation.watchPosition(
      position => {
        if (generation !== gpsGeneration) return;
        gpsText = 'GPS activo';
        setLocation(position.coords.latitude,position.coords.longitude,position.coords.accuracy);
      },
      error => {
        if (generation !== gpsGeneration) return;
        setMode('test',error.code === 1 ? 'GPS denegado · toca el mapa' : 'GPS no disponible · toca el mapa');
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:5000}
    );
  }
  render();
}
function drawPlayer() {
  if (!map) return;
  if (!locationFix) {
    playerMarker?.remove();
    accuracyCircle?.remove();
    playerMarker = accuracyCircle = null;
    return;
  }
  const point = [locationFix.lat,locationFix.lng];
  if (!playerMarker) {
    accuracyCircle = L.circle(point,{radius:0,interactive:false,color:'#246aba',weight:1,fillOpacity:.09}).addTo(map);
    playerMarker = L.circleMarker(point,{radius:8,interactive:false,color:'#fff',weight:3,fillColor:'#1569c2',fillOpacity:1}).addTo(map);
  }
  accuracyCircle.setLatLng(point).setRadius(locationFix.accuracy || 0);
  playerMarker.setLatLng(point).bringToFront();
}
function fitPark() {
  if (map) map.fitBounds(L.latLngBounds(outline[0]),{padding:[17,17],maxZoom:17,animate:false});
}
function initMap() {
  if (!window.L) return;
  map = L.map('map',{zoomControl:false}).setView(CENTER,16);
  L.control.zoom({position:'topleft'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  parkLayer = L.polygon(outline,{color:'#416952',weight:2,fillOpacity:.05,dashArray:'5 5',interactive:false}).addTo(map);
  markers = L.layerGroup().addTo(map);
  fitPark();
  map.on('click',({latlng}) => {
    if (mode === 'test') setLocation(latlng.lat,latlng.lng);
  });
  const resize = new ResizeObserver(() => {
    if (activeTab !== 'mapa') return;
    map.invalidateSize({pan:false});
    if (!locationFix && !selected) fitPark();
  });
  resize.observe($('map'));
}
function rebuildMarkers() {
  if (!map) return;
  parkLayer.setLatLngs(outline);
  markers.clearLayers();
  markerById.clear();
  const now = Date.now();
  for (const tree of trees.values()) {
    const condition = status(tree.id,now);
    const bounds = L.latLng(tree.lat,tree.lng);
    const marker = L.marker(bounds,{icon:treeIcon(condition),alt:tree.label,title:tree.label,bubblingMouseEvents:false}).addTo(markers);
    marker.on('click',() => {
      selected = tree.id;
      if (mode === 'test') setLocation(tree.lat,tree.lng);
      render();
    });
    markerById.set(tree.id,{marker,condition});
  }
  drawPlayer();
}
function treeIcon(condition) {
  const size = 21;
  return L.divIcon({className:'tree-icon',html:'<span aria-hidden="true" style="display:block;margin:4px;width:13px;height:13px;background:'+colors[condition]+';border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #273a3055"></span>',iconSize:[size,size],iconAnchor:[size/2,size/2]});
}
function ensureRivals(now) {
  const ids = [...trees.values()].sort((a,b) => hash('equipo/' + a.id)-hash('equipo/' + b.id));
  if (state.seededRivals || ids.length < 3) return;
  const picks = Math.min(6,Math.max(2,Math.floor(ids.length/4)));
  const available = ids.filter(tree => status(tree.id,now) === 'libre');
  for (const [index,tree] of available.slice(0,picks).entries()) {
    takeTree(tree.id,index%2 ? 'abedul' : 'haya',now);
    state.trees[tree.id].until = now + [3,4,5,6,2,7][index]*DAY;
  }
  state.seededRivals = true;
}
function installCatalog(data) {
  const parsed = parseOverpass(data);
  const wasEmpty = !trees.size;
  // Conserva los árboles que forman parte de la partida si OSM elimina su nodo.
  const previous = trees;
  outline = parsed.outline;
  trees = new Map(parsed.catalog.map(tree=>[tree.id,tree]));
  for (const id of new Set([...Object.keys(state.discoveries),...Object.keys(state.trees),...Object.keys(state.challenges)])) {
    const known = previous.get(id) || state.discoveries[id]?.tree || state.trees[id]?.tree;
    if (known && !trees.has(id)) trees.set(id,known);
  }
  if (selected && !trees.has(selected)) selected = null;
  // La selección diaria usa el catálogo actual, excluyendo fichas históricas.
  liveCatalog = parsed.catalog;
  radar.key = '';
  ensureRivals(Date.now());
  if (locationFix && inside !== inPark(locationFix)) setLocation(locationFix.lat,locationFix.lng,locationFix.accuracy);
  rebuildMarkers();
  if (wasEmpty && !locationFix) fitPark();
}
let liveCatalog = [];
async function loadTrees(force = false) {
  if (loading) return;
  if (!force && state.cache?.data && Date.now()-state.cache.fetchedAt < CACHE_AGE) {
    setMapStatus(catalogMessage('Datos de OpenStreetMap guardados'),false);
    return;
  }
  loading = true;
  setMapStatus(trees.size ? catalogMessage('Actualizando con Overpass…') : 'Buscando árboles en OpenStreetMap…',false);
  const query = '[out:json][timeout:12];(node["natural"="tree"](' + BOX.join(',') + ');relation(12532311););out geom;';
  for (const endpoint of ENDPOINTS) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(),9000);
    try {
      const response = await fetch(endpoint + '?data=' + encodeURIComponent(query),{signal:controller.signal});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      if (data.remark || !Array.isArray(data.elements) || !parseOverpass(data).catalog.length) throw new Error('Catálogo vacío o incompleto');
      state.cache = {data,fetchedAt:Date.now()};
      installCatalog(data);
      save();
      setMapStatus(catalogMessage('OpenStreetMap · Overpass'),false);
      loading = false;
      render();
      return;
    } catch {
      // Pasa al siguiente servidor y conserva la copia local si ambos fallan.
    } finally { clearTimeout(timeout); }
  }
  loading = false;
  setMapStatus(trees.size ? catalogMessage('Copia de OpenStreetMap · Overpass no disponible') : 'No se pudieron cargar los árboles.',true);
}
function catalogMessage(prefix) {
  return prefix + ' · ' + liveCatalog.length + ' árboles' + (liveCatalog.some(tree=>tree.height !== null) ? '' : ' · sin alturas registradas');
}
function setMapStatus(message, retry) {
  $('map-status').textContent = map ? message : 'No se cargó Leaflet. Recarga la página con conexión.';
  $('reload-trees').hidden = !retry || !map;
}
function remaining(ms) {
  const seconds = Math.max(0,Math.ceil(ms/1000));
  return Math.floor(seconds/60) + ':' + String(seconds%60).padStart(2,'0');
}
function duration(ms) {
  const minutes = Math.floor(ms/60000);
  return minutes >= 60 ? Math.floor(minutes/60) + ' h ' + minutes%60 + ' min' : minutes + ' min';
}
function challengeText(challenge,now) {
  return (challenge.direction === 'in' ? 'Te reta ' : 'Has retado a ') + TEAMS[challenge.rival] + ' · ' + remaining(challenge.ends-now);
}
function teamStatus(id,now) {
  const condition = status(id,now);
  const record = state.trees[id];
  if (condition === 'libre') return 'Libre';
  return (condition === 'seco' ? 'Seco · ' : '') + TEAMS[record.owner];
}
function treeMeta(tree) {
  return TIERS[tree.tier].name + ' · ' + (tree.height === null ? 'Altura sin registrar' : number.format(tree.height) + ' m') +
    (tree.genus ? ' · Género ' + tree.genus : '');
}
function actionButton(action,id,label,message = '') {
  return '<button type="button" class="primary" data-action="'+action+'" data-id="'+html(id)+'"' +
    (message ? ' disabled title="'+html(message)+'"' : '') + '>'+html(label)+'</button>';
}
function treeActions(tree,now,includePhoto = false) {
  const id = tree.id;
  const record = state.trees[id];
  const condition = status(id,now);
  const buttons = [], hints = [];
  function add(action,label) {
    const reason = restriction(action,tree,now);
    buttons.push(actionButton(action,id,label,reason));
    if (reason && !hints.includes(reason)) hints.push(reason);
  }
  if (includePhoto && !state.discoveries[id]) add('discover','Hacer foto');
  if (condition === 'libre') add('claim','Reclamar · ' + TIERS[tree.tier].price + ' Savia');
  else if (record.owner === 'roble') {
    if (state.challenges[id]?.direction === 'in') add('defend','Defender');
    add('care','Cuidar');
    if (record.level < LEVELS.length && cardCount(tree.cardKey) >= 3) add('level','Subir nivel · 3 cartas');
  } else if (!state.challenges[id]) add('challenge','Retar · ' + duelPrice(tree,now) + ' Savia');
  return (buttons.length ? '<div class="actions">'+buttons.join('')+'</div>' : '') +
    (hints.length ? '<p class="hint">'+html(hints.join(' '))+'</p>' : '');
}
function drawPanel(id,markup) {
  if (lastPaint[id] === markup) return;
  lastPaint[id] = markup;
  // Mantiene el foco en el mismo botón cuando cambia una cuenta atrás.
  const panel = $(id);
  const focus = document.activeElement;
  const buttons = [...panel.querySelectorAll('button')];
  const focusedButton = buttons.indexOf(focus);
  panel.innerHTML = markup;
  if (focusedButton >= 0) panel.querySelectorAll('button')[focusedButton]?.focus({preventScroll:true});
}
function renderMap(now) {
  const date = dayKey(now);
  const candidates = awakeCandidates(date);
  const nearest = locationFix ? Math.min(...candidates.map(tree=>meters(locationFix,tree))) : Infinity;
  const heat = nearest < 45 ? 'caliente' : nearest < 110 ? 'templado' : 'frío';
  const radarEl = $('radar');
  radarEl.dataset.heat = candidates.length && locationFix ? heat : '';
  radarEl.textContent = !liveCatalog.length ? 'Radar · esperando árboles' : !candidates.length ? 'Radar · encontrados por hoy' :
    !locationFix ? 'Radar · esperando ubicación' : 'Radar · ' + heat;
  const positionText = gpsText + (locationFix ? ' · ' + (inside ? 'dentro del parque' : 'fuera del parque') : '');
  if ($('gps-status').textContent !== positionText) $('gps-status').textContent = positionText;
  $('position-mode').textContent = mode === 'test' ? 'Activar GPS' : 'Modo prueba';
  for (const [id,item] of markerById) {
    const condition = status(id,now);
    if (item.condition !== condition) {
      item.marker.setIcon(treeIcon(condition));
      item.condition = condition;
    }
    const el = item.marker.getElement();
    if (el) {
      el.setAttribute('role','button');
      const label = trees.get(id).label + ' · ' + teamStatus(id,now);
      if (el.getAttribute('aria-label') !== label) el.setAttribute('aria-label',label);
    }
  }
  const tree = trees.get(selected);
  $('tree-detail').hidden = !tree;
  $('map-overview').hidden = !!tree;
  if (!tree) return;
  const distance = distanceTo(tree);
  const rec = state.trees[tree.id];
  const challenge = state.challenges[tree.id];
  const condition = status(tree.id,now);
  drawPanel('tree-detail',
    '<div class="row tree-heading"><div><h3>'+html(tree.label)+'</h3><small>'+html(treeMeta(tree))+'</small></div>' +
    '<button type="button" class="close" data-action="close" aria-label="Cerrar ficha">Cerrar</button></div>' +
    '<p class="hint">'+html(teamStatus(tree.id,now))+(condition === 'libre' ? '' : ' · '+vitality(rec,now)+' de 7 días') +
    (Number.isFinite(distance) ? ' · '+number.format(Math.floor(distance * 10)/10)+' m' : '')+'</p>' +
    (challenge ? '<p><strong>'+html(challengeText(challenge,now))+'</strong></p>' : '') + treeActions(tree,now,true));
}
function renderHerbarium() {
  const grouped = new Map();
  for (const {fecha,tree} of Object.values(state.discoveries)) {
    const key = tree.species ? tree.cardKey : tree.genus ? 'genero:' + tree.genus.toLowerCase() : 'sin-identificar';
    const label = tree.species || tree.genus && 'Género '+tree.genus || tree.label;
    if (!grouped.has(key)) grouped.set(key,{label,items:[]});
    grouped.get(key).items.push({fecha,tree});
  }
  const entries = [...grouped.values()].map(group =>
    '<article class="entry"><h3>'+html(group.label)+' · '+group.items.length+'</h3>' +
    group.items.map(({fecha,tree})=>'<p class="hint">OSM '+html(tree.id)+' · '+html(treeMeta(tree))+' · '+html(fullDate.format(new Date(fecha)))+'</p>').join('')+
    '</article>').join('');
  const cards = Object.entries(state.cards).flatMap(([key,stack]) => Object.entries(stack.variants).map(([variant,count]) =>
    '<article class="tile '+(variant === 'normal' ? '' : 'rare')+'"><strong>'+html(stack.label)+'</strong><small>' +
    html(VARIANTS[variant])+' · ×'+count+'</small>'+(variant === 'especial' ? '' :
    '<small>'+cardCount(key)+' disponibles para subir nivel</small>')+'</article>')).join('');
  drawPanel('herbarium','<h2>Herbario</h2><p class="hint">'+Object.keys(state.species).length+' especies identificadas · '+Object.keys(state.discoveries).length+
    ' árboles descubiertos</p><div class="entries">'+(entries || '<p>Haz una foto junto a un árbol para añadirlo a tu herbario.</p>')+
    '</div><h3>Cartas</h3>'+(cards ? '<div class="cards">'+cards+'</div>' : '<p class="hint">Descubre o cuida un árbol para ganar una carta.</p>'));
}
function renderMyTrees(now) {
  const list = [...trees.values()].filter(tree => state.trees[tree.id]?.owner === 'roble' && status(tree.id,now) !== 'libre');
  const entries = list.map(tree => {
    const record = state.trees[tree.id];
    const days = vitality(record,now);
    const challenge = state.challenges[tree.id];
    return '<article class="entry"><h3>'+html(tree.label)+'</h3><p class="hint">'+html(treeMeta(tree))+
      '</p><p><strong>'+LEVELS[record.level-1]+'</strong> · '+(days ? days+' de 7 días de vitalidad' : 'Seco · queda libre en '+duration(record.until+3*DAY-now))+
      '</p><progress max="7" value="'+days+'" aria-label="Vitalidad"></progress>'+
      (challenge ? '<p><strong>'+html(challengeText(challenge,now))+'</strong></p>' : '')+
      '<button type="button" class="secondary" data-action="show" data-id="'+html(tree.id)+'">Ver en mapa</button>'+treeActions(tree,now)+'</article>';
  }).join('');
  const outgoing = Object.entries(state.challenges).filter(([,challenge])=>challenge.direction === 'out')
    .map(([id,challenge])=>'<article class="entry"><h3>'+html(trees.get(id)?.label || 'Árbol '+id)+'</h3><p>'+html(challengeText(challenge,now))+
      '</p><button type="button" class="secondary" data-action="show" data-id="'+html(id)+'">Ver en mapa</button></article>').join('');
  drawPanel('my-trees','<div class="row"><h2>Mis árboles</h2><strong>'+ownedCount(now)+' / '+MAX_TREES+' árboles</strong></div>'+
    (entries || '<p class="hint">Reclama un árbol libre desde el mapa para hacerte su guardián.</p>')+
    '<div class="entries"><h3>Retos que has iniciado</h3>'+(outgoing || '<p class="hint">Sin retos salientes.</p>')+'</div>');
}
function renderProfile(now) {
  const points = pointsAt(now);
  const teams = Object.entries(TEAMS).map(([id,team]) => '<article class="tile"><strong>'+team+'</strong><small>'+
    number.format(state.points[id])+' pts acumulados</small><small>+'+number.format(points[id])+' pts hoy</small></article>').join('');
  const stats = state.stats;
  const impact = Math.floor(stats.spent/200);
  const totals = state.daily.date === dayKey(now) ? state.daily : {timeSavia:0,discoverySavia:0};
  const rows = [['Savia ganada',stats.earned],['Savia gastada',stats.spent],['Árboles descubiertos',Object.keys(state.discoveries).length],
    ['Km andados',new Intl.NumberFormat('es-ES',{maximumFractionDigits:3}).format(stats.meters/1000)],
    ['Tiempo en el parque',duration(stats.parkMs)],['Retos ganados',stats.wins],['Retos perdidos',stats.losses]];
  drawPanel('profile','<h2>Perfil y estadísticas</h2><p class="hint">Tu equipo es Roble.</p><div class="teams">'+teams+
    '</div><article class="entry"><h3>Has ayudado a plantar '+number.format(impact)+' '+(impact === 1 ? 'árbol' : 'árboles')+
    '</h3><p class="hint">Forestry France · impacto simulado</p><progress max="200" value="'+stats.spent%200+
    '" aria-label="Progreso de Savia hacia el siguiente árbol"></progress><small>'+stats.spent%200+' de 200 Savia gastada hacia el siguiente árbol</small></article>'+
    '<div class="stats">'+rows.map(([label,value])=>'<article class="tile"><small>'+html(label)+'</small><strong>'+html(typeof value === 'number' ? number.format(value) : value)+'</strong></article>').join('')+
    '</div><p class="ref-line">Hoy: '+totals.timeSavia+' / 12 Savia por tiempo y '+totals.discoverySavia+
    ' / 20 por descubrir árboles. Día del juego: hora de Oxford. El tiempo cuenta mientras la página está visible.</p>'+
    '<button type="button" class="secondary" data-action="export">Exportar datos (JSON)</button>');
}
function render(now = Date.now()) {
  $('wallet').textContent = number.format(state.savia)+' Savia';
  const alert = Object.values(state.challenges).filter(challenge=>challenge.direction === 'in').sort((a,b)=>a.ends-b.ends)[0];
  $('duel-banner').hidden = !alert;
  if (alert) $('duel-banner').textContent = challengeText(alert,now) + ' · Mis árboles';
  if (activeTab === 'mapa') renderMap(now);
  else if (activeTab === 'herbario') renderHerbarium();
  else if (activeTab === 'arboles') renderMyTrees(now);
  else renderProfile(now);
}
function showTab(tab) {
  activeTab = tab;
  for (const button of document.querySelectorAll('nav [role=tab]')) {
    const on = button.id === 'tab-'+tab;
    button.setAttribute('aria-selected',on);
    button.tabIndex = on ? 0 : -1;
    $(button.getAttribute('aria-controls')).hidden = !on;
  }
  if (tab === 'mapa' && map) map.invalidateSize({pan:false});
  render();
}
function exportData() {
  tick();
  save();
  const data = JSON.stringify({juego:'Forestrix',parque:'University Parks, Oxford',exportado:new Date().toISOString(),...state},null,2);
  const url = URL.createObjectURL(new Blob([data],{type:'application/json'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'forestrix-'+dayKey(Date.now())+'.json';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url),30000);
}
function openPhoto(id) {
  const tree = trees.get(id);
  const now = tick();
  const block = !tree || restriction('discover',tree,now);
  if (block) { if (tree) notify(block); return; }
  photoTree = id;
  const picker = $('camera');
  picker.value = '';
  picker.click();
}
$('camera').addEventListener('change',event => {
  const id = photoTree;
  photoTree = null;
  if (id && event.target.files.length) act('discover',id);
  event.target.value = '';
});
$('camera').addEventListener('cancel',() => { photoTree = null; });
$('position-mode').addEventListener('click',() => setMode(mode === 'test' ? 'gps' : 'test'));
$('duel-banner').addEventListener('click',() => showTab('arboles'));
$('reload-trees').addEventListener('click',() => loadTrees(true));
$('locate').addEventListener('click',() => {
  if (map && locationFix) map.setView([locationFix.lat,locationFix.lng],Math.max(16,map.getZoom()));
  else fitPark();
});
document.addEventListener('click',event => {
  const button = event.target.closest('button[data-action], nav button');
  if (!button) return;
  if (button.matches('nav button')) { showTab(button.id.slice(4)); return; }
  const {action,id} = button.dataset;
  if (action === 'close') { selected = null; render(); }
  else if (action === 'export') exportData();
  else if (action === 'discover') openPhoto(id);
  else if (action === 'show') {
    const tree = trees.get(id);
    if (!tree) return;
    selected = id;
    showTab('mapa');
    map?.setView([tree.lat,tree.lng],Math.max(17,map.getZoom()));
  } else act(action,id);
});
document.querySelector('nav').addEventListener('keydown',event => {
  const buttons = [...document.querySelectorAll('nav button')];
  const index = buttons.indexOf(event.target);
  const destination = {ArrowLeft:(index+buttons.length-1)%buttons.length,ArrowRight:(index+1)%buttons.length,Home:0,End:buttons.length-1}[event.key];
  if (index < 0 || destination === undefined) return;
  event.preventDefault();
  showTab(buttons[destination].id.slice(4));
  buttons[destination].focus();
});
document.addEventListener('visibilitychange',() => {
  const now = Date.now();
  if (document.hidden) save();
  else {
    lastTick = now;
    walkAnchor = null;
    render(tick(now));
  }
});
initMap();
if (state.cache?.data || SNAPSHOT) {
  installCatalog(state.cache?.data || SNAPSHOT);
  setMapStatus(catalogMessage(state.cache?.data ? 'Datos de OpenStreetMap guardados' : 'Copia de OpenStreetMap'),false);
}
tick();
showTab('mapa');
const previousTestPosition = state.testPosition;
setMode(mode);
if (mode === 'test' && previousTestPosition) setLocation(previousTestPosition.lat,previousTestPosition.lng);
loadTrees();
setInterval(() => render(tick()),1000);
</script>
